<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Favicon: container ship on a customs boom gate (white on CV blue) -->
  <rect width="512" height="512" rx="104" fill="rgb(13,64,128)"/>
  <g fill="#ffffff">
    <!-- ship: hull, two container stacks, bridge -->
    <polygon points="130,262 450,262 405.2,338.8 168.4,338.8"/>
    <rect x="174.8" y="198" width="64" height="56.3"/>
    <rect x="251.6" y="172.4" width="64" height="81.9"/>
    <rect x="366.8" y="178.8" width="25.6" height="75.5"/>
    <!-- boom gate: post, foot, pivot hub -->
    <rect x="60" y="330" width="40" height="118" rx="10"/>
    <rect x="44" y="436" width="72" height="20" rx="8"/>
    <circle cx="80" cy="382" r="28"/>
    <!-- striped boom: filled segments -->
    <rect x="96" y="362" width="72" height="42"/>
    <rect x="240" y="362" width="72" height="42"/>
    <rect x="384" y="362" width="72" height="42" rx="12"/>
  </g>
  <!-- boom outline (the open segments) -->
  <rect x="101" y="367" width="350" height="32" rx="10" fill="none" stroke="#ffffff" stroke-width="10"/>
</svg>
